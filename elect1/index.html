<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전기회로 키트</title>
<style>
  :root{
    --bg:#f4f1ea; --panel:#ffffff; --ink:#2b2d33; --muted:#6b6f78; --line:#ddd6c8;
    --accent:#2f6fde; --warn:#d93025; --board:#fbfaf6; --grid:#ebe5d8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif}
  body{display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:20px;margin:0 8px 0 0;white-space:nowrap}
  .tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  button,select{font:inherit;font-size:15px;border:1px solid var(--line);background:#fff;color:var(--ink);
    padding:7px 12px;border-radius:10px;cursor:pointer}
  button:hover,select:hover{border-color:#b9b0a0}
  button:disabled{opacity:.4;cursor:default}
  button.on{background:#e8f0fe;border-color:var(--accent);color:#1a4fb0}
  .brand{margin-left:auto;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);
    padding:6px 12px 6px 6px;border:1px solid var(--line);border-radius:999px;background:#fffdf8;white-space:nowrap;font-size:14px}
  .brand:hover{border-color:#9b5de5}
  .brand .pad{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:17px;
    background:linear-gradient(135deg,#4f7cff,#9b5de5)}
  .brand b{background:linear-gradient(90deg,#ff6b6b,#ffb703,#2ec4b6,#4f7cff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand small{color:var(--muted);font-size:12px}
  .sitefoot{text-align:center;font-size:12px;color:var(--muted);padding:5px 8px;background:var(--panel);border-top:1px solid var(--line)}
  .sitefoot a{color:inherit;font-weight:700}
  .sitefoot a:hover{color:#9b5de5}
  label.chk{display:flex;align-items:center;gap:4px;font-size:15px;padding:0 4px;cursor:pointer;white-space:nowrap}
  main{flex:1;display:flex;min-height:0}
  aside{width:150px;background:var(--panel);border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:10px;overflow:auto}
  aside h2{font-size:14px;color:var(--muted);margin:0}
  .part{border:1px solid var(--line);border-radius:12px;padding:6px;text-align:center;cursor:grab;user-select:none;touch-action:none;background:#fffdf8}
  .part:hover{border-color:var(--accent)}
  .part svg{width:100%;height:64px;pointer-events:none}
  .part div{font-size:15px;font-weight:600}
  .hint{font-size:12.5px;color:var(--muted);line-height:1.5}
  #stage{flex:1;position:relative;min-width:0}
  #board{width:100%;height:100%;display:block;touch-action:none;user-select:none;background:var(--board)}
  #status{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.92);border:1px solid var(--line);
    border-radius:12px;padding:8px 12px;font-size:15px;pointer-events:none}
  #warn{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--warn);color:#fff;font-weight:700;
    padding:10px 16px;border-radius:12px;font-size:16px;display:none;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.2)}
  .term{cursor:crosshair}
  .term circle.ring{fill:transparent}
  .term:hover circle.dot,.term.target circle.dot{fill:#ffe082;stroke:#f57f17}
  .comp{cursor:move}
  .wirehit{cursor:pointer}
  @keyframes blink{50%{opacity:.25}}
  .shorted{animation:blink .5s infinite}
  .hotwire{animation:blink .35s infinite}
  #warn.burst{background:#e65100}
  #safety{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(560px,calc(100% - 24px));background:#fff8e1;
    border:3px solid #ffb300;border-radius:16px;padding:12px 40px 12px 14px;font-size:15px;line-height:1.55;display:none;
    box-shadow:0 8px 24px rgba(0,0,0,.18)}
  #safety b.t{display:block;font-size:16px;color:#b71c1c;margin-bottom:2px}
  #safety button{position:absolute;right:8px;top:8px;border:0;background:transparent;font-size:18px;padding:2px 6px}
  select:disabled{opacity:.45;cursor:default}
  @media (max-width:720px){
    main{flex-direction:column}
    aside{width:auto;flex-direction:row;border-right:0;border-bottom:1px solid var(--line);padding:8px}
    aside h2,.hint{display:none}
    .part{flex:1}
    .part svg{height:44px}
    header h1{font-size:17px}
  }
</style>
</head>
<body>
<header>
  <h1>⚡ 전기회로 키트</h1>
  <div class="tools">
    <button id="btnRotate" title="선택한 부품 돌리기 (R)">⟳ 돌리기</button>
    <button id="btnDelete" title="선택한 부품·전선 지우기 (Delete)">🗑 지우기</button>
    <select id="bulbRating" title="선택한 전구가 견딜 수 있는 전압">
      <option value="1.5">1.5V 전구</option>
      <option value="3">3V 전구</option>
      <option value="4.5" selected>4.5V 전구 (기본)</option>
      <option value="6">6V 전구</option>
    </select>
    <button id="btnFix" title="터진 전구, 그을린 전지를 새것으로 바꾸기">🔧 새것으로</button>
    <button id="btnClear">모두 지우기</button>
    <select id="preset">
      <option value="">예시 회로 불러오기…</option>
      <option value="basic">전지 1개 + 전구 1개</option>
      <option value="batSeries">전지 2개 직렬연결</option>
      <option value="batSeries3">전지 3개 직렬연결</option>
      <option value="batParallel">전지 2개 병렬연결</option>
      <option value="bulbSeries">전구 2개 직렬연결</option>
      <option value="bulbParallel">전구 2개 병렬연결</option>
      <option value="touch">전지와 전구를 맞대어 불 켜기</option>
      <option value="touchSeries">전지 2개 맞대기 + 전구</option>
      <option value="burst">⚠ 안전 교육: 전지 4개 직렬 (스위치를 닫으면 펑!)</option>
    </select>
    <label class="chk"><input type="checkbox" id="chkFlow" checked> 전류 흐름 보기</label>
    <label class="chk"><input type="checkbox" id="chkBright"> 밝기 숫자 보기</label>
    <label class="chk"><input type="checkbox" id="chkSound" checked> 소리</label>
  </div>
  <a class="brand" href="https://games.brendy.net/" title="Brendy Games 첫 화면으로">
    <span class="pad">🎮</span><span><b>Brendy</b> Games<br><small>games.brendy.net</small></span>
  </a>
</header>
<main>
  <aside>
    <h2>부품함</h2>
    <div class="part" data-type="cell"><svg id="pv-cell" viewBox="-90 -45 185 90"></svg><div>전지</div></div>
    <div class="part" data-type="battery"><svg id="pv-battery" viewBox="-125 -45 250 90"></svg><div>전지 + 끼우개</div></div>
    <div class="part" data-type="bare"><svg id="pv-bare" viewBox="-60 -100 120 140"></svg><div>전구</div></div>
    <div class="part" data-type="bulb"><svg id="pv-bulb" viewBox="-90 -90 180 145"></svg><div>전구 + 끼우개</div></div>
    <div class="part" data-type="switch"><svg id="pv-switch" viewBox="-110 -40 220 80"></svg><div>스위치</div></div>
    <p class="hint">부품을 끌어다 놓거나 눌러서 꺼내요.<br><br>은색 <b>단자</b>를 끌어 다른 단자에 놓으면 전선이 연결돼요.<br><br>전구는 <b>꼭지</b>와 <b>꼭지쇠</b>에 각각 연결해야 불이 켜져요.<br><br>전지와 전구를 서로 <b>맞닿게</b> 놓아도 전기가 통해요.<br><br>스위치를 누르면 열리고 닫혀요.</p>
  </aside>
  <div id="stage">
    <svg id="board" viewBox="0 0 1400 860" preserveAspectRatio="xMidYMid meet">
      <defs>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M40 0H0V40" fill="none" stroke="var(--grid)" stroke-width="1.5"/>
        </pattern>
        <radialGradient id="glow">
          <stop offset="0" stop-color="#fff59d" stop-opacity="1"/>
          <stop offset=".35" stop-color="#ffe066" stop-opacity=".75"/>
          <stop offset="1" stop-color="#ffd54f" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="cell" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#5b6170"/><stop offset=".5" stop-color="#2c303a"/><stop offset="1" stop-color="#1c1f26"/>
        </linearGradient>
        <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffd76a"/><stop offset=".5" stop-color="#d9a21b"/><stop offset="1" stop-color="#a87a10"/>
        </linearGradient>
        <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#e2c08a"/><stop offset="1" stop-color="#c69a5a"/>
        </linearGradient>
      </defs>
      <rect x="-2000" y="-2000" width="5400" height="4860" fill="url(#grid)"/>
      <text id="empty" x="700" y="430" text-anchor="middle" font-size="28" fill="#b5ab98">왼쪽 부품함에서 전지, 전구, 스위치를 꺼내 보세요</text>
      <g id="gComps"></g>
      <g id="gWires"></g>
      <g id="gDots" pointer-events="none"></g>
      <g id="gTerms"></g>
      <g id="gFx" pointer-events="none"></g>
      <path id="draft" fill="none" stroke="#2f6fde" stroke-width="6" stroke-dasharray="10 8" stroke-linecap="round" pointer-events="none"/>
    </svg>
    <div id="status"></div>
    <div id="warn"></div>
    <div id="safety"><button id="safetyClose" title="닫기">✕</button><b class="t"></b><span class="m"></span></div>
  </div>
</main>
<footer class="sitefoot">© <a href="https://games.brendy.net/">Brendy Games</a> · 배우는 즐거움, 노는 즐거움</footer>

<script>
(() => {
  // ---------- 설정 ----------
  const E = 1.5;          // 전지 1개 전압 (V)
  const R_INT = 0.1;      // 전지 내부 저항 (Ω)
  const R_BULB = 10;      // 전구 저항 (Ω)
  const R_WIRE = 0.01;    // 전선·닫힌 스위치 저항 (Ω)
  const SHORT_I = 2;      // 이 전류(A)를 넘으면 합선으로 판단
  const P0 = Math.pow(E / (R_BULB + R_INT + 4 * R_WIRE), 2) * R_BULB; // 기준 밝기: 전지 1개 + 전구 1개 + 스위치 (전선 3개)
  const BURST_K = 1.15;   // 전구 용량(V)의 1.15배를 넘는 전압이 걸리면 전구가 터진다 (4.5V 전구: 전지 3개 OK, 4개 펑)
  const SCORCH_MS = 1500; // 합선이 이 시간(ms) 넘게 계속되면 불이 붙고 전지가 그을린다
  const WIRE_COLORS =['#e53935', '#263238', '#1e88e5', '#fbc02d', '#43a047'];
  const W = 1400, H = 860;

  const TOUCH = 7;        // 단자끼리 이 거리(px) 안이면 맞닿은 것으로 본다
  const SNAP = 28;        // 놓을 때 이 거리 안의 단자에 착 붙인다
  // 단자의 n: 전기적으로 같은 곳(마디) 번호. 전지의 n=1이 (+)극, 전구(bare)의 n=0이 꼭지쇠, n=1이 꼭지
  const DEFS = {
    battery: { terms: [{ x: -112, y: 0, dx: -1, dy: 0, n: 0 }, { x: 112, y: 0, dx: 1, dy: 0, n: 1 }], box: [-122, -50, 244, 100] },
    cell:    { terms: [{ x: -72, y: 0, dx: -1, dy: 0, n: 0 }, { x: 82, y: 0, dx: 1, dy: 0, n: 1 }], box: [-84, -40, 180, 80], small: true },
    bulb:    { terms: [{ x: -78, y: 27, dx: -1, dy: 0, n: 0 }, { x: 78, y: 27, dx: 1, dy: 0, n: 1 }], box: [-92, -92, 184, 150] },
    bare:    { terms: [{ x: -19, y: -3, dx: -1, dy: 0, n: 0 }, { x: 19, y: -3, dx: 1, dy: 0, n: 0 }, { x: 0, y: 30, dx: 0, dy: 1, n: 1 }], box: [-50, -100, 100, 150], small: true },
    switch:  { terms: [{ x: -98, y: 0, dx: -1, dy: 0, n: 0 }, { x: 98, y: 0, dx: 1, dy: 0, n: 1 }], box: [-108, -40, 216, 98] },
  };
  const isBat = t => t === 'battery' || t === 'cell';
  const isBulb = t => t === 'bulb' || t === 'bare';
  const nTerms = c => DEFS[c.type].terms.length;
  const ratingOf = c => c.rating || 4.5;

  // ---------- 상태 ----------
  let comps = [], wires = [], nextId = 1, colorIdx = 0;
  let selected = null;           // {kind:'comp'|'wire', id}
  let drag = null;               // 부품 이동
  let wireDraft = null;          // 전선 그리기
  let palettePending = null;     // 부품함에서 끌기
  let result = null;
  let anim = [];                 // 전류 점 애니메이션
  let lastRating = 4.5;          // 새로 꺼내는 전구의 용량
  let hot = [];                  // 합선으로 뜨거워진 곳 (불꽃이 튀는 위치)
  let shortSince = 0, lastBurst = -1e9;

  const $ = id => document.getElementById(id);
  const svg = $('board');
  const gComps = $('gComps'), gWires = $('gWires'), gDots = $('gDots'), gTerms = $('gTerms'), gFx = $('gFx'), draft = $('draft');
  const showFlow = () => $('chkFlow').checked;
  const showBright = () => $('chkBright').checked;

  // ---------- 기하 ----------
  function termPos(c, t) {
    const d = DEFS[c.type].terms[t], a = c.rot * Math.PI / 180, cs = Math.cos(a), sn = Math.sin(a);
    return { x: c.x + d.x * cs - d.y * sn, y: c.y + d.x * sn + d.y * cs, dx: d.dx * cs - d.dy * sn, dy: d.dx * sn + d.dy * cs };
  }
  const compById = id => comps.find(c => c.id === id);
  function wirePath(w) {
    const ca = compById(w.a.c), cb = compById(w.b.c);
    const p = termPos(ca, w.a.t), q = termPos(cb, w.b.t);
    const dist = Math.hypot(q.x - p.x, q.y - p.y), k = Math.max(50, dist * 0.4);
    return `M${p.x},${p.y} C${p.x + p.dx * k},${p.y + p.dy * k + dist * 0.12} ${q.x + q.dx * k},${q.y + q.dy * k + dist * 0.12} ${q.x},${q.y}`;
  }
  function svgPt(e) {
    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }
  function nearestTerm(p, exclude) {
    let best = null, bd = 30;
    for (const c of comps) for (let t = 0; t < nTerms(c); t++) {
      if (exclude && exclude.c === c.id && exclude.t === t) continue;
      const q = termPos(c, t), d = Math.hypot(q.x - p.x, q.y - p.y);
      if (d < bd) { bd = d; best = { c: c.id, t }; }
    }
    return best;
  }

  // ---------- 회로 계산 (마디 해석법) ----------
  // 서로 다른 부품의 단자가 맞닿은 곳 찾기
  function findContacts() {
    const out = [];
    for (let i = 0; i < comps.length; i++) for (let j = i + 1; j < comps.length; j++) {
      const a = comps[i], b = comps[j];
      for (let ta = 0; ta < nTerms(a); ta++) {
        const p = termPos(a, ta);
        for (let tb = 0; tb < nTerms(b); tb++) {
          const q = termPos(b, tb);
          if (Math.hypot(p.x - q.x, p.y - q.y) < TOUCH) out.push({ a: { c: a.id, t: ta }, b: { c: b.id, t: tb } });
        }
      }
    }
    return out;
  }
  const nodeKey = e => e.c + ':' + DEFS[compById(e.c).type].terms[e.t].n;

  function solve() {
    const idx = new Map(); let n = 0;
    for (const c of comps) { idx.set(c.id + ':0', n++); idx.set(c.id + ':1', n++); }
    const G = Array.from({ length: n }, () => new Float64Array(n)), I = new Float64Array(n);
    const addG = (a, b, g) => { G[a][a] += g; G[b][b] += g; G[a][b] -= g; G[b][a] -= g; };
    for (let i = 0; i < n; i++) G[i][i] += 1e-9;
    for (const c of comps) {
      const a = idx.get(c.id + ':0'), b = idx.get(c.id + ':1');
      if (isBat(c.type)) { addG(a, b, 1 / R_INT); I[b] += E / R_INT; I[a] -= E / R_INT; } // 마디1 = (+)극
      else if (isBulb(c.type) && !c.broken) addG(a, b, 1 / R_BULB); // 터진 전구는 전기가 통하지 않는다
      else if (c.type === 'switch' && c.closed) addG(a, b, 1 / R_WIRE);
    }
    for (const w of wires) addG(idx.get(nodeKey(w.a)), idx.get(nodeKey(w.b)), 1 / R_WIRE);
    const contacts = findContacts();
    for (const k of contacts) addG(idx.get(nodeKey(k.a)), idx.get(nodeKey(k.b)), 1 / R_WIRE);

    // 가우스 소거
    const V = new Float64Array(n), M = G.map((row, i) => { const r = Array.from(row); r.push(I[i]); return r; });
    for (let col = 0; col < n; col++) {
      let piv = col;
      for (let r = col + 1; r < n; r++) if (Math.abs(M[r][col]) > Math.abs(M[piv][col])) piv = r;
      [M[col], M[piv]] = [M[piv], M[col]];
      const d = M[col][col]; if (Math.abs(d) < 1e-15) continue;
      for (let r = col + 1; r < n; r++) {
        const f = M[r][col] / d; if (!f) continue;
        for (let k = col; k <= n; k++) M[r][k] -= f * M[col][k];
      }
    }
    for (let r = n - 1; r >= 0; r--) {
      let s = M[r][n]; for (let k = r + 1; k < n; k++) s -= M[r][k] * V[k];
      V[r] = Math.abs(M[r][r]) < 1e-15 ? 0 : s / M[r][r];
    }
    const v = key => V[idx.get(key)];
    const res = { comp: {}, wire: {}, short: false, contacts };
    for (const c of comps) {
      const dv = v(c.id + ':1') - v(c.id + ':0');
      if (isBat(c.type)) {
        const cur = (E - dv) / R_INT; res.comp[c.id] = { I: cur, short: Math.abs(cur) > SHORT_I };
        if (Math.abs(cur) > SHORT_I) res.short = true;
      } else if (isBulb(c.type)) {
        const cur = c.broken ? 0 : dv / R_BULB; res.comp[c.id] = { I: cur, P: cur * cur * R_BULB, V: Math.abs(dv) };
      }
    }
    for (const w of wires) res.wire[w.id] = (v(nodeKey(w.a)) - v(nodeKey(w.b))) / R_WIRE; // a→b 방향 전류
    return res;
  }

  // ---------- 그리기 ----------
  function drawBattery(c, r) {
    const sh = r && r.short ? ' class="shorted"' : '';
    return `
      <rect x="-100" y="-34" width="200" height="68" rx="12" fill="#3a4050" stroke="${r && r.short ? '#d93025' : '#232733'}" stroke-width="${r && r.short ? 5 : 2}"${sh}/>
      <rect x="-112" y="-4" width="24" height="8" fill="#b8c0c8"/><rect x="88" y="-4" width="24" height="8" fill="#b8c0c8"/>
      <rect x="-96" y="-10" width="8" height="20" fill="#c9d0d6"/><rect x="88" y="-10" width="8" height="20" fill="#c9d0d6"/>
      <polyline points="-88,-12 -84,12 -80,-12 -76,12 -72,-12" fill="none" stroke="#c9d0d6" stroke-width="3"/>
      <rect x="-70" y="-23" width="142" height="46" rx="8" fill="url(#cell)"/>
      <rect x="34" y="-23" width="38" height="46" fill="url(#band)"/>
      <rect x="72" y="-9" width="10" height="18" rx="3" fill="#d6dbe0"/>
      <text x="-18" y="7" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">1.5V</text>
      <text x="53" y="8" text-anchor="middle" font-size="22" font-weight="900" fill="#5a3d00">+</text>
      ${soot(c)}
      <text x="-100" y="-42" text-anchor="middle" font-size="26" font-weight="900" fill="#1f4fbf">−</text>
      <text x="100" y="-42" text-anchor="middle" font-size="26" font-weight="900" fill="#d32f2f">+</text>`;
  }
  function drawCell(c, r) {

  function drawBulb(c, r) {

  // 끼우개 없는 전구: 꼭지쇠(옆면 나사 부분)와 꼭지(맨 아래 끝)
  function drawBare(c, r) {

      <path d="M-17 -14 L17 -10 M-17 -6 L17 -2 M-17 2 L17 6" stroke="#8d969e" stroke-width="2"/>

  function drawSwitch(c) {

      <rect x="-84" y="-28" width="168" height="56" rx="10" fill="url(#wood)" stroke="#a37b41" stroke-width="2"/>

  function render() {
    result = solve();
    // 용량보다 높은 전압이 걸린 전구는 터진다 (가장 심한 것부터 하나씩: 터지면 회로가 바뀌므로 다시 계산)

    }

    // 부품

      const [bx, by, bw, bh] = DEFS[c.type].box;
      h += `<g class="comp" data-comp="${c.id}" transform="translate(${c.x},${c.y}) rotate(${c.rot})">
        <rect x="${bx}" y="${by}" width="${bw}" height="${bh}" fill="transparent"/>
        ${drawComp(c, result.comp[c.id])}

  function updateWarn() {

  // ---------- 전기 안전 안내 ----------

    short: ['⚠ 전기 안전: 합선은 위험해요!',

    burst: ['⚠ 전기 안전: 알맞은 전압을 써요!',
      '전구마다 견딜 수 있는 전압(용량)이 정해져 있어요. 전지를 너무 많이 이어 높은 전압을 걸면 필라멘트가 끊어지고 <b>전구가 깨지거나 불이 날 수</b> 있어요. 전기 기구는 정해진 전압에서만 사용해요.'],

  let safetyTimer = 0;
  function showSafety(kind) {

  $('safetyClose').onclick = () => { $('safety').style.display = 'none'; };

  // ---------- 효과 (불꽃·연기·펑) ----------
  let parts = [], emitters = [];
  const rnd = (a, b) => a + Math.random() * (b - a);
  function spawn(kind, x, y, n) {
    for (let i = 0; i < n; i++) {
      const a = rnd(0, Math.PI * 2), sp = kind === 'spark' ? rnd(120, 380) : kind === 'shard' ? rnd(150, 420) : rnd(10, 40);
      parts.push({ kind, x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (kind === 'smoke' ? 40 : 60),

  function glassPos(c) {

  function burstFx(c, ratio) {

    emitters.push({ x: p.x, y: p.y, until: performance.now() + 3000, kind: 'smoke' });
    if (ratio > 2) emitters.push({ x: p.x, y: p.y + 10, until: performance.now() + 2500, kind: 'fire' }); // 전압이 아주 높으면 불까지
    sound('pop'); showSafety('burst');

  function stepFx(dt, now) {
    // 합선: 불꽃이 튀고, 오래 계속되면 불이 붙는다
    const burning = result && result.short && now - shortSince > SCORCH_MS;
    if (result && result.short) for (const h of hot) {
      if (Math.random() < 0.6) spawn('spark', h.x + rnd(-30, 30), h.y + rnd(-12, 12), 1);
      if (burning && Math.random() < 0.25) spawn('smoke', h.x + rnd(-20, 20), h.y - 30, 1);
      if (burning && h.c && !h.c.scorched) { h.c.scorched = true; render(); }
      if (Math.random() < 0.05) sound('crackle');
    }
    emitters = emitters.filter(e => e.until > now);
    for (const e of emitters) if (Math.random() < 0.3) spawn('smoke', e.x + rnd(-10, 10), e.y, 1);
    let h = '';
    const flames = (burning ? hot : []).concat(emitters.filter(e => e.kind === 'fire'));
    flames.forEach((f, i) => {
      const s = 46 + 10 * Math.sin(now / 90 + i * 2) + rnd(-3, 3);
      h += `<text x="${f.x}" y="${f.y - 6}" font-size="${s}" text-anchor="middle" opacity=".95">🔥</text>`;
      h += `<text x="${f.x - 26}" y="${f.y + 6}" font-size="${s * 0.6}" text-anchor="middle" opacity=".85">🔥</text>`;
    });
    parts = parts.filter(p => (p.life += dt) < p.max);
    for (const p of parts) {
      const t = p.life / p.max;
      if (p.kind !== 'flash' && p.kind !== 'boom') {
        p.x += p.vx * dt; p.y += p.vy * dt;
        if (p.kind === 'smoke') p.vy -= 20 * dt; else p.vy += 600 * dt;
      }
      if (p.kind === 'spark') h += `<circle cx="${p.x}" cy="${p.y}" r="${3.5 * (1 - t) + 1}" fill="${t < 0.4 ? '#fffde7' : '#ffb300'}"/>`;
      else if (p.kind === 'shard') h += `<path d="M0 -7 L5 5 L-5 4 Z" transform="translate(${p.x},${p.y}) rotate(${p.rot + t * 500})" fill="#cfe8ff" stroke="#7aa6c9" opacity="${1 - t}"/>`;
      else if (p.kind === 'smoke') h += `<circle cx="${p.x}" cy="${p.y}" r="${12 + 30 * t}" fill="#6d6d6d" opacity="${0.45 * (1 - t)}"/>`;

      else if (p.kind === 'boom') h += `<text x="${p.x}" y="${p.y}" font-size="${60 + 30 * Math.min(t * 4, 1)}" font-weight="900" text-anchor="middle" fill="#e53935" stroke="#fff" stroke-width="4" paint-order="stroke" opacity="${t < 0.7 ? 1 : (1 - t) / 0.3}">💥펑!</text>`;

  }

  // ---------- 소리 ----------
  let actx = null;
  function sound(kind) {
    if (!$('chkSound').checked) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const dur = kind === 'pop' ? 0.45 : 0.06, n = actx.sampleRate * dur, buf = actx.createBuffer(1, n, actx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, kind === 'pop' ? 3 : 6);
      const src = actx.createBufferSource(), g = actx.createGain(), f = actx.createBiquadFilter();
      f.type = kind === 'pop' ? 'lowpass' : 'highpass'; f.frequency.value = kind === 'pop' ? 1200 : 2500;
      g.gain.value = kind === 'pop' ? 0.6 : 0.25;
      src.buffer = buf; src.connect(f); f.connect(g); g.connect(actx.destination); src.start();
    } catch (_) {}
  }

  function buildDots() {
    anim = []; let h = '';
    if (!showFlow()) { gDots.innerHTML = ''; return; }
    const list = [];
    for (const w of wires) {
      const cur = result.wire[w.id];
      if (Math.abs(cur) < 0.003) continue;
      const path = $('wp' + w.id), len = path.getTotalLength(), k = Math.max(2, Math.floor(len / 34));
      list.push({ path, len, k, cur, off: (anim.find(a => a.id === w.id) || {}).off || 0, id: w.id });
      for (let i = 0; i < k; i++) h += `<circle r="5" fill="#ffeb3b" stroke="#e65100" stroke-width="2" data-d="${w.id}"/>`;
    }
    gDots.innerHTML = h;
    const circles = gDots.querySelectorAll('circle'); let ci = 0;
    for (const a of list) { a.dots = Array.from(circles).slice(ci, ci + a.k); ci += a.k; anim.push(a); }
    stepDots(0);
  }
  let last = performance.now();
  function stepDots(dt) {
    for (const a of anim) {
      const speed = Math.min(420, 50 + 260 * Math.abs(a.cur)) * Math.sign(a.cur);
      a.off = (a.off + speed * dt) % a.len; if (a.off < 0) a.off += a.len;
      const gap = a.len / a.k;
      a.dots.forEach((d, i) => {
        const p = a.path.getPointAtLength((a.off + i * gap) % a.len);
        d.setAttribute('cx', p.x); d.setAttribute('cy', p.y);
      });
    }
  }
  function loop(t) { const dt = Math.min(0.05, (t - last) / 1000); last = t; stepDots(dt); stepFx(dt, t); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);

  // ---------- 조작 ----------
  function addComp(type, x, y) {
    const c = { id: nextId++, type, x, y, rot: 0, closed: false };
    if (isBulb(type)) c.rating = lastRating;
    comps.push(c); selected = { kind: 'comp', id: c.id }; return c;
  }
  function clamp(c) { c.x = Math.max(60, Math.min(W - 60, c.x)); c.y = Math.max(60, Math.min(H - 60, c.y)); }
  // 놓았을 때 가까운 다른 부품의 단자에 착 붙여서 맞닿게 한다
  function snap(c) {
    let best = null, bd = SNAP;
    for (let t = 0; t < nTerms(c); t++) {
      const p = termPos(c, t);
      for (const o of comps) if (o !== c) for (let u = 0; u < nTerms(o); u++) {
        const q = termPos(o, u), d = Math.hypot(q.x - p.x, q.y - p.y);
        if (d < bd) { bd = d; best = { dx: q.x - p.x, dy: q.y - p.y }; }
      }
    }
    if (best) { c.x += best.dx; c.y += best.dy; }
  }
  function deleteSelected() {
    if (!selected) return;
    if (selected.kind === 'comp') {
      comps = comps.filter(c => c.id !== selected.id);
      wires = wires.filter(w => w.a.c !== selected.id && w.b.c !== selected.id);
    } else wires = wires.filter(w => w.id !== selected.id);
    selected = null; render();
  }
  function rotateSelected() {
    if (!selected || selected.kind !== 'comp') return;
    const c = compById(selected.id); c.rot = (c.rot + 90) % 360; render();
  }

  svg.addEventListener('pointerdown', e => {
    const p = svgPt(e);
    const term = e.target.closest('[data-term]');
    if (term) {
      const [c, t] = term.dataset.term.split(':').map(Number);
      wireDraft = { from: { c, t } };
      e.preventDefault(); return;
    }
    const comp = e.target.closest('[data-comp]');
    if (comp) {
      const c = compById(+comp.dataset.comp);
      drag = { c, dx: p.x - c.x, dy: p.y - c.y, sx: p.x, sy: p.y, moved: false };
      selected = { kind: 'comp', id: c.id };
      comps.splice(comps.indexOf(c), 1); comps.push(c); // 맨 위로
      render(); e.preventDefault(); return;
    }
    const wire = e.target.closest('[data-wire]');
    if (wire) { selected = { kind: 'wire', id: +wire.dataset.wire }; render(); return; }
    selected = null; render();
  });

  window.addEventListener('pointermove', e => {
    if (palettePending) {
      if (!palettePending.c && Math.hypot(e.clientX - palettePending.sx, e.clientY - palettePending.sy) > 6) {
        const p = svgPt(e); palettePending.c = addComp(palettePending.type, p.x, p.y);
        drag = { c: palettePending.c, dx: 0, dy: 0, sx: p.x, sy: p.y, moved: true };
      }
    }
    if (drag) {
      const p = svgPt(e);
      if (Math.hypot(p.x - drag.sx, p.y - drag.sy) > 5) drag.moved = true;
      if (drag.moved) { drag.c.x = p.x - drag.dx; drag.c.y = p.y - drag.dy; render(); }
    } else if (wireDraft) {
      const p = svgPt(e), c = compById(wireDraft.from.c), s = termPos(c, wireDraft.from.t);
      draft.setAttribute('d', `M${s.x},${s.y} L${p.x},${p.y}`);
      const tgt = nearestTerm(p, wireDraft.from);
      gTerms.querySelectorAll('.term.target').forEach(el => el.classList.remove('target'));
      if (tgt) { const el = gTerms.querySelector(`[data-term="${tgt.c}:${tgt.t}"]`); if (el) el.classList.add('target'); }
    }
  });

  window.addEventListener('pointerup', e => {
    if (palettePending) {
      const pp = palettePending; palettePending = null;
      if (!pp.c) { // 눌러서 꺼내기
        const n = comps.length % 6;
        addComp(pp.type, 560 + n * 50, 300 + n * 50);
        drag = null; render(); return;
      }
      const r = svg.getBoundingClientRect();
      if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) {
        comps = comps.filter(c => c !== pp.c); selected = null;
      }
    }
    if (drag) {
      const c = drag.c;
      if (!drag.moved && c.type === 'switch') c.closed = !c.closed;
      if (drag.moved) { clamp(c); snap(c); }
      drag = null; render(); return;
    }
    if (wireDraft) {
      const tgt = nearestTerm(svgPt(e), wireDraft.from), f = wireDraft.from;
      wireDraft = null; draft.setAttribute('d', '');
      if (tgt) {
        const dup = wires.some(w => (w.a.c === f.c && w.a.t === f.t && w.b.c === tgt.c && w.b.t === tgt.t) ||
                                    (w.b.c === f.c && w.b.t === f.t && w.a.c === tgt.c && w.a.t === tgt.t));
        if (!dup) {
          const w = { id: nextId++, a: f, b: tgt, color: WIRE_COLORS[colorIdx++ % WIRE_COLORS.length] };
          wires.push(w); selected = { kind: 'wire', id: w.id };
        }
      }
      render();
    }
  });
  window.addEventListener('pointercancel', () => { drag = null; wireDraft = null; palettePending = null; draft.setAttribute('d', ''); render(); });

  document.querySelectorAll('.part').forEach(el => {
    el.addEventListener('pointerdown', e => {
      palettePending = { type: el.dataset.type, sx: e.clientX, sy: e.clientY, c: null };
      e.preventDefault();
    });
  });

  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
    if (e.key === 'Delete' || e.key === 'Backspace') { deleteSelected(); e.preventDefault(); }
    else if (e.key === 'r' || e.key === 'R' || e.key === 'ㄱ') rotateSelected();
    else if (e.key === 'Escape') { selected = null; render(); }
  });
  $('btnRotate').onclick = rotateSelected;
  $('btnDelete').onclick = deleteSelected;
  $('btnClear').onclick = () => { if (!comps.length || confirm('모든 부품과 전선을 지울까요?')) { comps = []; wires = []; selected = null; render(); } };
  $('btnFix').onclick = () => {
    const c = selected && selected.kind === 'comp' && compById(selected.id);
    if (c) { c.broken = false; c.scorched = false; render(); }
  };
  $('bulbRating').onchange = e => {
    lastRating = +e.target.value;
    const c = selected && selected.kind === 'comp' && compById(selected.id);
    if (c && isBulb(c.type)) c.rating = lastRating;
    render();
  };
  $('chkFlow').onchange = render;
  $('chkBright').onchange = render;

  // ---------- 예시 회로 ----------
  function loadPreset(name) {
    comps = []; wires = []; selected = null; colorIdx = 0;
    const B = (x, y, rot = 0) => addComp('battery', x, y).id && Object.assign(comps[comps.length - 1], { rot });
    const L = (x, y) => addComp('bulb', x, y);
    const S = (x, y, closed = true) => Object.assign(addComp('switch', x, y), { closed });
    const wire = (c1, t1, c2, t2) => wires.push({ id: nextId++, a: { c: c1.id, t: t1 }, b: { c: c2.id, t: t2 }, color: WIRE_COLORS[colorIdx++ % WIRE_COLORS.length] });
    if (name === 'basic') {
      const b = B(480, 620), s = S(880, 620), l = L(680, 300);
      wire(b, 1, s, 0); wire(s, 1, l, 1); wire(l, 0, b, 0);
    } else if (name === 'batSeries') {
      const b1 = B(400, 620), b2 = B(680, 620), s = S(980, 620), l = L(700, 300);
      wire(b1, 1, b2, 0); wire(b2, 1, s, 0); wire(s, 1, l, 1); wire(l, 0, b1, 0);
    } else if (name === 'batSeries3' || name === 'burst') {
      const n = name === 'burst' ? 4 : 3, x0 = 700 - (n - 1) * 130;
      const bs = Array.from({ length: n }, (_, i) => addComp('cell', x0 + i * 154, 640));
      const s = S(1000, 380, name !== 'burst'), l = L(560, 300);
      wire(bs[n - 1], 1, s, 1); wire(s, 0, l, 1); wire(l, 0, bs[0], 0);
    } else if (name === 'batParallel') {
      const b1 = B(520, 540), b2 = B(520, 720), s = S(920, 540), l = L(720, 260);
      wire(b1, 1, b2, 1); wire(b1, 0, b2, 0); wire(b1, 1, s, 0); wire(s, 1, l, 1); wire(l, 0, b1, 0);
    } else if (name === 'bulbSeries') {
      const b = B(500, 640), s = S(900, 640), l1 = L(520, 300), l2 = L(880, 300);
      wire(b, 1, s, 0); wire(s, 1, l2, 1); wire(l2, 0, l1, 1); wire(l1, 0, b, 0);
    } else if (name === 'bulbParallel') {
      const b = B(500, 680), s = S(900, 680), l1 = L(700, 210), l2 = L(700, 430);
      wire(l1, 1, l2, 1); wire(l1, 0, l2, 0); wire(b, 1, s, 0); wire(s, 1, l2, 1); wire(l2, 0, b, 0);
    } else if (name === 'touch') {
      // 전구의 꼭지를 전지 (+)극에 맞대고, 전지 (−)극과 꼭지쇠를 전선 하나로 잇기
      const c = addComp('cell', 560, 480), l = Object.assign(addComp('bare', 672, 480), { rot: 90 });
      wire(c, 0, l, 0);
    } else if (name === 'touchSeries') {
      // 끼우개 없는 전지 2개를 맞대어 직렬연결
      const c1 = addComp('cell', 420, 520), c2 = addComp('cell', 574, 520), l = Object.assign(addComp('bare', 686, 520), { rot: 90 });
      wire(c1, 0, l, 0);
    }
    selected = null; render();
  }
  $('preset').onchange = e => { if (e.target.value) { if (!comps.length || confirm('지금 회로를 지우고 예시 회로를 불러올까요?')) loadPreset(e.target.value); e.target.value = ''; } };

  // ---------- 저장 ----------
  function save() {
    try { localStorage.setItem('circuitKit.v1', JSON.stringify({ comps, wires, nextId, colorIdx })); } catch (_) {}
  }
  function load() {
    try {
      const d = JSON.parse(localStorage.getItem('circuitKit.v1'));
      if (d && Array.isArray(d.comps)) { comps = d.comps; wires = d.wires || []; nextId = d.nextId || 1; colorIdx = d.colorIdx || 0; }
    } catch (_) {}
  }

  // ---------- 부품함 미리보기 ----------
  // 같은 문서 안이라 보드의 그라디언트(#cell, #wood 등)를 그대로 쓸 수 있다
  $('pv-battery').innerHTML = drawBattery({ rot: 0 });
  $('pv-bulb').innerHTML = drawBulb({ rot: 0 }, null);
  $('pv-cell').innerHTML = drawCell({ rot: 0 }, null);
  $('pv-bare').innerHTML = drawBare({ rot: 0 }, null).replace(/<text[\s\S]*?<\/text>/g, '');
  $('pv-switch').innerHTML = drawSwitch({ rot: 0, closed: false }).replace(/<text[\s\S]*?<\/text>/, '');

  load(); render();
})();
</script>
</body>
</html>
