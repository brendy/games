<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>쌓기나무 위·앞·옆</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧊</text></svg>">
<style>
  :root{
    --bg:#f4f1ea; --panel:#ffffff; --ink:#2b2d33; --muted:#6b6f78; --line:#ddd6c8;
    --accent:#2f6fde; --ok:#1e9e55; --warn:#d93025;
    --top:#2e8b3e; --front:#e89a00; --side:#d0443a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif}
  body{display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:20px;margin:0 6px 0 0;white-space:nowrap}
  .tabs{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .tabs button{border:0;border-radius:0;padding:8px 14px}
  .tabs button+button{border-left:1px solid var(--line)}
  button{font:inherit;font-size:15px;border:1px solid var(--line);background:#fff;color:var(--ink);
    padding:7px 12px;border-radius:10px;cursor:pointer}
  button:hover{border-color:#b9b0a0}
  button.on{background:#e8f0fe;border-color:var(--accent);color:#1a4fb0;font-weight:700}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  button.primary:hover{filter:brightness(1.08)}
  .score{display:flex;gap:6px;font-size:14px}
  .score span{padding:5px 10px;border-radius:999px;background:#fffdf8;border:1px solid var(--line);white-space:nowrap}
  .score b{font-size:16px}
  .brand{margin-left:auto;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);
    padding:6px 12px 6px 6px;border:1px solid var(--line);border-radius:999px;background:#fffdf8;white-space:nowrap;font-size:14px}
  .brand:hover{border-color:#9b5de5}
  .brand .pad{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:17px;
    background:linear-gradient(135deg,#4f7cff,#9b5de5)}
  .brand b{background:linear-gradient(90deg,#ff6b6b,#ffb703,#2ec4b6,#4f7cff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand small{color:var(--muted);font-size:12px}
  main{flex:1;display:flex;min-height:0}
  #view{flex:1;position:relative;min-width:0;background:radial-gradient(circle at 50% 35%,#ffffff,#e9e4d8)}
  #view canvas{display:block;width:100%;height:100%;touch-action:none}
  .camBtns{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap}
  .camBtns button{font-size:13px;padding:6px 10px;background:rgba(255,255,255,.92)}
  .tool{position:absolute;right:12px;bottom:12px;display:none;gap:6px}
  .tool.show{display:flex}
  .tool button{font-size:15px;padding:8px 14px;background:rgba(255,255,255,.95)}
  aside{width:300px;background:var(--panel);border-left:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px;overflow:auto}
  aside>*{flex-shrink:0}
  aside h2{font-size:17px;margin:0}
  .how{font-size:15px;line-height:1.6;margin:0;color:#3a3d45}
  .how li{margin-bottom:4px}
  .legend{display:flex;gap:6px;flex-wrap:wrap}
  .legend span{font-size:13px;font-weight:700;color:#fff;padding:3px 10px;border-radius:999px}
  .msg{border-radius:12px;padding:12px;font-size:15px;line-height:1.55;background:#f7f5ef;border:1px solid var(--line);min-height:64px}
  .msg.ok{background:#e7f6ec;border-color:#9ad4ae;color:#11633a}
  .msg.bad{background:#fdecea;border-color:#f2b1aa;color:#9b1c13}
  .msg .big{font-size:22px;font-weight:800;display:block;margin-bottom:4px}
  .actions{display:flex;gap:8px}
  .actions button{flex:1;padding:11px 8px;font-size:16px}
  .sitefoot{text-align:center;font-size:12px;color:var(--muted);padding:5px 8px;background:var(--panel);border-top:1px solid var(--line)}
  .sitefoot a{color:inherit;font-weight:700}
  .sitefoot a:hover{color:#9b5de5}
  @media (max-width:820px){
    main{flex-direction:column}
    #view{min-height:52vh}
    aside{width:auto;border-left:0;border-top:1px solid var(--line);padding:12px 16px}
    .msg{order:-3;min-height:0} .actions{order:-2} #clear{order:-1}
    .brand small{display:none}
  }
</style>

<body>
<header>
  <h1>🧊 쌓기나무 위·앞·옆</h1>
  <div class="tabs" role="tablist">
    <button id="tabA" class="on" role="tab">A 보고 모양 그리기</button>
    <button id="tabB" role="tab">B 모양 보고 쌓기</button>
  </div>
  <div class="score"><span>A 점수 <b id="scA">0</b></span><span>B 점수 <b id="scB">0</b></span></div>
  <a class="brand" href="https://games.brendy.net/" title="Brendy Games 첫 화면으로">
    <span class="pad">🎮</span><span><b>Brendy</b> Games<br><small>games.brendy.net</small></span>
  </a>
</header>

<main>
  <div id="view">
    <div class="camBtns">
      <button data-cam="home">↺ 처음 시점</button>
      <button data-cam="front">앞에서 보기</button>
      <button data-cam="side">옆에서 보기</button>
      <button data-cam="top">위에서 보기</button>
    </div>
    <div class="tool" id="tool">
      <button id="toolAdd" class="on">➕ 쌓기</button>
      <button id="toolDel">➖ 빼기</button>
    </div>
  </div>
  <aside>
    <h2 id="howTitle">A. 쌓기나무를 보고 모양 그리기</h2>
    <ol class="how" id="how"></ol>
    <div class="legend"><span style="background:var(--top)">위</span><span style="background:var(--front)">앞</span><span style="background:var(--side)">옆</span></div>
    <div class="msg" id="msg">문제를 풀고 <b>확인</b>을 눌러 보세요.</div>
    <div class="actions">
      <button class="primary" id="check">✔ 확인</button>
      <button id="next">새 문제</button>

  </aside>
</main>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------- 좌표: x = 오른쪽(옆 방향), y = 위, z = 앞(학생 쪽). 쌓기나무 칸 i(x) j(z) 0~2 ---------- */
const GAP = 3;                    // 쌓기나무와 판 사이 칸 수
const FRONT_Z = 1.5 + GAP;        // 앞 판 (z)
const SIDE_X = 1.5 + GAP;         // 옆 판 (x)
const TOP_Y = 3 + GAP;            // 위 판 (y)
const COL = { top: 0x2e8b3e, front: 0xe89a00, side: 0xd0443a, wood: 0xf3b86b, woodEdge: 0x9a6a2e };

/* ---------- 문제 ---------- */
function views(h) {
  const top = [], front = [], side = [];
  for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) if (h[i][j] > 0) top.push(i + ',' + j);
  for (let i = 0; i < 3; i++) { const m = Math.max(h[i][0], h[i][1], h[i][2]); for (let y = 1; y <= m; y++) front.push(i + ',' + y); }
  for (let j = 0; j < 3; j++) { const m = Math.max(h[0][j], h[1][j], h[2][j]); for (let y = 1; y <= m; y++) side.push(j + ',' + y); }
  return { top: new Set(top), front: new Set(front), side: new Set(side) };
}
const sameSet = (a, b) => a.size === b.size && [...a].every(x => b.has(x));
function connected(cells) {
  const arr = [...cells]; if (!arr.length) return false;
  const seen = new Set([arr[0]]), st = [arr[0]];
  while (st.length) {
    const [i, j] = st.pop().split(',').map(Number);
    for (const [di, dj] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const k = (i + di) + ',' + (j + dj);
      if (cells.has(k) && !seen.has(k)) { seen.add(k); st.push(k); }
    }
  }
  return seen.size === cells.size;
}
let lastKey = '';
function makeProblem() {
  const pick = [0, 0, 1, 1, 1, 2, 2, 3];
  for (;;) {
    const h = [0, 1, 2].map(() => [0, 1, 2].map(() => pick[Math.floor(Math.random() * pick.length)]));
    const v = views(h), tot = h.flat().reduce((a, b) => a + b, 0);
    if (tot < 5 || tot > 12 || v.top.size < 4 || v.top.size > 8) continue;
    const is = new Set([...v.top].map(k => k[0])), js = new Set([...v.top].map(k => k[2]));
    if (is.size < 3 || js.size < 3 || !connected(v.top) || Math.max(...h.flat()) < 2) continue;
    if (sameSet(v.front, v.side) || v.front.size === 9 || v.side.size === 9) continue;
    const key = JSON.stringify(h); if (key === lastKey) continue;
    lastKey = key; return h;
  }
}

/* ---------- 3D 장면 ---------- */
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
view.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.enablePan = false;
controls.minDistance = 8; controls.maxDistance = 40; controls.maxPolarAngle = Math.PI * 0.49;
const TARGET = new THREE.Vector3(1.2, 2.2, 1.2);
controls.target.copy(TARGET);

scene.add(new THREE.HemisphereLight(0xffffff, 0xb9ad96, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.4); sun.position.set(6, 12, 9); scene.add(sun);

// 바닥
const ground = new THREE.Mesh(new THREE.CircleGeometry(14, 48), new THREE.MeshLambertMaterial({ color: 0xe7e0cf }));
ground.rotation.x = -Math.PI / 2; ground.position.set(1.2, -0.01, 1.2); scene.add(ground);

const boxGeo = new THREE.BoxGeometry(1, 1, 1);
const edgeGeo = new THREE.EdgesGeometry(boxGeo);
const woodMat = new THREE.MeshLambertMaterial({ color: COL.wood });
const edgeMat = new THREE.LineBasicMaterial({ color: COL.woodEdge });

const shapeGroup = new THREE.Group(); scene.add(shapeGroup);
const floorGroup = new THREE.Group(); scene.add(floorGroup);   // B 노란 바닥 칸
const panelGroup = new THREE.Group(); scene.add(panelGroup);

const cx = i => i - 1;          // 칸 중심 좌표
const cz = j => j - 1;

function cube(i, j, y) {
  const m = new THREE.Mesh(boxGeo, woodMat); m.position.set(cx(i), y - 0.5, cz(j));
  m.add(new THREE.LineSegments(edgeGeo, edgeMat)); m.userData = { col: [i, j] };
  return m;
}

// 얇은 판: 3x3 칸, 각 칸은 클릭 가능한 얇은 사각형
const panels = {};   // name -> {cells: Map(key -> mesh), color}
function makePanel(name, color, place) {
  const g = new THREE.Group(); const cells = new Map();
  const frame = new THREE.Mesh(new THREE.PlaneGeometry(3.24, 3.24),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.12, side: THREE.DoubleSide, depthWrite: false }));
  g.add(frame);
  for (let a = 0; a < 3; a++) for (let b = 0; b < 3; b++) {
    const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.35, side: THREE.DoubleSide, depthWrite: false });
    const c = new THREE.Mesh(new THREE.PlaneGeometry(0.94, 0.94), mat);
    c.position.set(a - 1, b - 1, 0.002); c.userData = { panel: name, a, b };
    g.add(c); cells.set(a + ',' + b, c);
  }
  const grid = []; for (let k = 0; k <= 3; k++) { grid.push(-1.5, k - 1.5, 0.004, 1.5, k - 1.5, 0.004, k - 1.5, -1.5, 0.004, k - 1.5, 1.5, 0.004); }
  const lg = new THREE.BufferGeometry(); lg.setAttribute('position', new THREE.Float32BufferAttribute(grid, 3));
  g.add(new THREE.LineSegments(lg, new THREE.LineBasicMaterial({ color })));
  place(g); panelGroup.add(g);
  panels[name] = { cells, color, filled: new Set() };
}
// 앞 판: z = FRONT_Z, 가로 = x(i), 세로 = y.   칸 키 = "i,y" (y 1~3)
makePanel('front', COL.front, g => { g.position.set(0, 1.5, FRONT_Z); });
// 옆 판: x = SIDE_X, 가로 = z(j), 세로 = y.   옆(오른쪽)에서 볼 때 왼쪽이 앞(z+)
makePanel('side', COL.side, g => { g.position.set(SIDE_X, 1.5, 0); g.rotation.y = Math.PI / 2; });
// 위 판: y = TOP_Y, 가로 = x(i), 세로 = z(j)
makePanel('top', COL.top, g => { g.position.set(0, TOP_Y, 0); g.rotation.x = -Math.PI / 2; });

// 판 칸 (a,b) ↔ 문제 키
function cellKey(name, a, b) {
  if (name === 'front') return a + ',' + (b + 1);          // a = i, b = y-1
  if (name === 'side') return (2 - a) + ',' + (b + 1);     // 회전으로 a가 z 반대 방향 → j = 2-a
  return a + ',' + (2 - b);                                // top: 회전 후 b가 -z 방향 → j = 2-b
}
function setCell(name, key, on, color) {
  const p = panels[name];
  for (const [ab, mesh] of p.cells) {
    const [a, b] = ab.split(',').map(Number);
    if (cellKey(name, a, b) === key) {
      mesh.material.color.set(on ? (color ?? p.color) : 0xffffff);
      mesh.material.opacity = on ? 0.9 : 0.35;
    }
  }
  on ? p.filled.add(key) : p.filled.delete(key);
}
function clearPanels() { for (const n in panels) for (const k of [...panels[n].filled]) setCell(n, k, false); }

// 라벨 (교과서 동그라미)
function label(text, color, pos) {
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const g = cv.getContext('2d');
  g.fillStyle = color; g.beginPath(); g.arc(64, 64, 58, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#fff'; g.font = 'bold 66px "Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, 64, 70);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), depthTest: false }));
  s.scale.set(0.9, 0.9, 1); s.position.copy(pos); s.renderOrder = 10; scene.add(s);
}
label('앞', '#e89a00', new THREE.Vector3(0, 3.6, FRONT_Z));
label('옆', '#d0443a', new THREE.Vector3(SIDE_X, 3.6, 0));
label('위', '#2e8b3e', new THREE.Vector3(-2.1, TOP_Y, -1.5));

// B 노란 바닥 칸
for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) {
  const t = new THREE.Mesh(new THREE.PlaneGeometry(0.96, 0.96),
    new THREE.MeshBasicMaterial({ color: 0xffd84a, transparent: true, opacity: 0.75, side: THREE.DoubleSide }));
  t.rotation.x = -Math.PI / 2; t.position.set(cx(i), 0.005, cz(j)); t.userData = { col: [i, j] };
  floorGroup.add(t);
}

/* ---------- 상태 ---------- */
const state = { mode: 'A', h: null, solved: false, build: null, tool: 'add',
  score: JSON.parse(localStorage.getItem('block-score') || '{"A":0,"B":0}') };
const $ = id => document.getElementById(id);
function showScore() { $('scA').textContent = state.score.A; $('scB').textContent = state.score.B;
  try { localStorage.setItem('block-score', JSON.stringify(state.score)); } catch (e) {} }

function drawShape(h) {
  shapeGroup.clear();
  for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) for (let y = 1; y <= h[i][j]; y++) shapeGroup.add(cube(i, j, y));
}
const HOW = {
  A: ['가운데 쌓기나무를 이리저리 돌려 보세요. (끌어서 회전, 휠·두 손가락으로 확대)',
      '<b style="color:var(--front)">앞</b>·<b style="color:var(--side)">옆</b>·<b style="color:var(--top)">위</b> 판의 칸을 눌러 그 방향에서 본 모양을 색칠해요.',
      '다 칠했으면 <b>확인</b>!'],
  B: ['판에 그려진 위·앞·옆에서 본 모양을 살펴보세요.',
      '노란 바닥 칸을 눌러 쌓기나무를 쌓아요. 빼려면 <b>➖ 빼기</b>를 고르고 누르세요.',
      '한 칸에 3층까지 쌓을 수 있어요. 다 쌓았으면 <b>확인</b>!']
};
function msg(html, cls = '') { const m = $('msg'); m.className = 'msg ' + cls; m.innerHTML = html; }

function newProblem() {
  state.h = makeProblem(); state.solved = false; clearPanels();
  const v = views(state.h);
  if (state.mode === 'A') {
    drawShape(state.h); floorGroup.visible = false;
  } else {
    state.build = [[0,0,0],[0,0,0],[0,0,0]]; drawShape(state.build); floorGroup.visible = true;
    for (const k of v.top) setCell('top', k, true);
    for (const k of v.front) setCell('front', k, true);
    for (const k of v.side) setCell('side', k, true);
  }
  msg(state.mode === 'A' ? '판의 칸을 눌러 <b>위·앞·옆에서 본 모양</b>을 색칠해 보세요.' : '판의 모양을 보고 노란 바닥 위에 <b>쌓기나무</b>를 쌓아 보세요.');
}
function setMode(m) {
  state.mode = m;
  $('tabA').classList.toggle('on', m === 'A'); $('tabB').classList.toggle('on', m === 'B');
  $('tool').classList.toggle('show', m === 'B');
  $('howTitle').textContent = m === 'A' ? 'A. 쌓기나무를 보고 모양 그리기' : 'B. 모양을 보고 쌓기나무 쌓기';
  $('how').innerHTML = HOW[m].map(t => '<li>' + t + '</li>').join('');
  newProblem();
}

function check() {
  const v = views(state.h); const bad = [];
  let count = 0;
  if (state.mode === 'A') {
    for (const n of ['top', 'front', 'side']) if (!sameSet(panels[n].filled, v[n])) bad.push(n);
  } else {
    const u = views(state.build); count = state.build.flat().reduce((a, b) => a + b, 0);
    if (count === 0) { msg('아직 쌓기나무를 쌓지 않았어요.', 'bad'); return; }
    for (const n of ['top', 'front', 'side']) if (!sameSet(u[n], v[n])) bad.push(n);
  }
  const name = { top: '위', front: '앞', side: '옆' };
  if (!bad.length) {
    let extra = '';
    if (!state.solved) { state.solved = true; state.score[state.mode]++; showScore(); extra = ' <b>+1점</b>'; }
    else extra = ' (이 문제는 이미 점수를 받았어요)';
    const cnt = state.mode === 'B' ? `<br>사용한 쌓기나무: <b>${count}개</b>` : '';
    msg(`<span class="big">🎉 정답!</span>위·앞·옆에서 본 모양이 모두 맞아요.${extra}${cnt}<br><b>새 문제</b>로 계속 도전해 보세요.`, 'ok');
  } else {
    msg(`<span class="big">다시 확인해요</span>${bad.map(n => '· ' + name[n] + '에서 본 모양이 달라요.').join('<br>')}`, 'bad');
  }
}
function clearWork() {
  if (state.mode === 'A') clearPanels();
  else { state.build = [[0,0,0],[0,0,0],[0,0,0]]; drawShape(state.build); }
  msg('처음부터 다시 해 보세요.');
}

/* ---------- 클릭 (끌기와 구분) ---------- */
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let down = null;
renderer.domElement.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) { down = null; return; }
  down = null;
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  if (state.mode === 'A') {
    const hit = ray.intersectObjects(panelGroup.children, true).find(x => x.object.userData.panel);
    if (!hit) return;
    const { panel, a, b } = hit.object.userData; const k = cellKey(panel, a, b);
    setCell(panel, k, !panels[panel].filled.has(k));
  } else {
    const hit = ray.intersectObjects([...shapeGroup.children, ...floorGroup.children], false)[0];
    if (!hit) return;
    const [i, j] = hit.object.userData.col; const h = state.build;
    if (state.tool === 'add') { if (h[i][j] < 3) h[i][j]++; else msg('한 칸에는 3층까지만 쌓을 수 있어요.'); }
    else if (h[i][j] > 0) h[i][j]--;
    drawShape(h);
  }
});

/* ---------- 시점 ---------- */
const CAMS = {
  home: [11, 10, 13], front: [TARGET.x, 2.6, 22], side: [24, 2.6, TARGET.z], top: [TARGET.x, 26, TARGET.z + 0.01]
};
let camAnim = null;
function goCam(name) {
  const to = new THREE.Vector3(...CAMS[name]);
  if (name === 'front') to.set(0, 1.6, 22); if (name === 'side') to.set(24, 1.6, 0); if (name === 'top') to.set(0, 26, 0.01);
  const tgt = name === 'home' ? TARGET.clone() : name === 'top' ? new THREE.Vector3(0, 0, 0) : new THREE.Vector3(name === 'side' ? 0 : 0, 1.6, 0);
  camAnim = { from: camera.position.clone(), to, tFrom: controls.target.clone(), tTo: tgt, t: 0 };
}
document.querySelectorAll('[data-cam]').forEach(b => b.onclick = () => goCam(b.dataset.cam));

/* ---------- 버튼 ---------- */
$('tabA').onclick = () => setMode('A');
$('tabB').onclick = () => setMode('B');
$('check').onclick = check;
$('next').onclick = newProblem;
$('clear').onclick = clearWork;
$('toolAdd').onclick = () => { state.tool = 'add'; $('toolAdd').classList.add('on'); $('toolDel').classList.remove('on'); };
$('toolDel').onclick = () => { state.tool = 'del'; $('toolDel').classList.add('on'); $('toolAdd').classList.remove('on'); };

/* ---------- 실행 ---------- */
function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(view);
camera.position.set(...CAMS.home);
resize(); showScore(); setMode('A');
renderer.setAnimationLoop(() => {
  if (camAnim) {
    camAnim.t = Math.min(1, camAnim.t + 0.06); const e = 1 - Math.pow(1 - camAnim.t, 3);
    camera.position.lerpVectors(camAnim.from, camAnim.to, e); controls.target.lerpVectors(camAnim.tFrom, camAnim.tTo, e);
    if (camAnim.t >= 1) camAnim = null;
  }
  controls.update(); renderer.render(scene, camera);
});
</script>
