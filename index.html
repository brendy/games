<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brendy Games</title>
<meta name="description" content="놀면서 배우는 교실 게임과 실험실">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
<style>
  :root{
    --bg:#fff8ec; --bg2:#ffeccc; --ink:#2a2540; --muted:#6c6582; --card:#ffffff; --line:#f0e2c8;
    --c1:#ff6b6b; --c2:#ffb703; --c3:#2ec4b6; --c4:#4f7cff; --c5:#9b5de5; --shadow:0 10px 30px rgba(80,50,10,.12);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17142a; --bg2:#221d3d; --ink:#f4f1ff; --muted:#a9a3c4; --card:#25204a; --line:#3a3466; --shadow:0 10px 30px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{min-height:100vh;color:var(--ink);background:radial-gradient(1200px 600px at 10% -10%,var(--bg2),transparent 60%),
    radial-gradient(900px 500px at 110% 10%,var(--bg2),transparent 60%),var(--bg);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;overflow-x:hidden}
  .bgshapes{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .bgshapes span{position:absolute;font-size:42px;opacity:.16;animation:float 9s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-18px) rotate(8deg)}}
  .wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:48px 16px 32px}

  header{text-align:center;margin-bottom:44px}
  .logo{display:inline-flex;align-items:center;gap:14px}
  .logo .pad{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:36px;
    background:linear-gradient(135deg,var(--c4),var(--c5));box-shadow:var(--shadow);transform:rotate(-6deg)}
  h1{font-size:clamp(36px,7vw,60px);margin:0;letter-spacing:-1px;font-weight:900}
  h1 .g{background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c4));-webkit-background-clip:text;background-clip:text;color:transparent}
  .tagline{margin:14px 0 0;font-size:clamp(17px,2.6vw,21px);color:var(--muted);font-weight:600}
  .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
  .chip{padding:6px 14px;border-radius:999px;font-size:14px;font-weight:700;background:var(--card);border:2px solid var(--line)}

  h2{font-size:20px;margin:0 0 16px;display:flex;align-items:center;gap:8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
  .card{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:inherit;background:var(--card);
    border:3px solid var(--line);border-radius:28px;padding:22px 18px 20px;box-shadow:var(--shadow);
    transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
  a.card:hover,a.card:focus-visible{transform:translateY(-6px) rotate(-1deg);border-color:var(--c2);outline:none;
    box-shadow:0 18px 40px rgba(255,170,0,.25)}
  .icon{width:100%;max-width:200px;aspect-ratio:1;border-radius:22px;display:grid;place-items:center;
    background:linear-gradient(160deg,#2b2f5a,#171a36)}
  .icon svg{width:88%;height:88%}
  .halo{transition:opacity .3s, r .3s;opacity:.75}
  a.card:hover .halo{opacity:1}
  .title{margin-top:16px;font-size:23px;font-weight:900}
  .sub{margin-top:2px;font-size:15px;font-weight:700;color:var(--muted)}
  .meta{margin-top:6px;display:flex;gap:6px}
  .tag{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:#e7fbf8;color:#11796f}
  .tag.y{background:#fff2cc;color:#8a5a00}
  .card.soon{opacity:.7;border-style:dashed;box-shadow:none;background:transparent}
  .card.soon .icon{background:transparent;border:3px dashed var(--line);font-size:64px}

  footer a{color:inherit;font-weight:700}
  footer{margin-top:56px;text-align:center;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="bgshapes" aria-hidden="true">
  <span style="left:6%;top:14%">⚡</span><span style="left:86%;top:20%;animation-delay:-2s">🔬</span>
  <span style="left:12%;top:72%;animation-delay:-4s">🧩</span><span style="left:80%;top:76%;animation-delay:-6s">🎲</span>
  <span style="left:48%;top:88%;animation-delay:-3s">✏️</span>
</div>
<div class="wrap">
  <header>
    <div class="logo"><div class="pad">🎮</div><h1><span class="g">Brendy</span> Games</h1></div>
    <p class="tagline">놀면서 배우는 우리 반 게임 &amp; 실험실</p>
    <div class="chips"><span class="chip">🎮 게임</span><span class="chip">🔬 과학 실험</span><span class="chip">📚 교과 학습</span></div>
  </header>

  <main>
    <div class="grid">
      <a class="card" href="elect1/" aria-label="6학년 전기회로 실험실로 가기">
        <div class="icon">
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <defs>
              <radialGradient id="hl"><stop offset="0" stop-color="#fff59d"/><stop offset=".4" stop-color="#ffd54f" stop-opacity=".7"/><stop offset="1" stop-color="#ffb300" stop-opacity="0"/></radialGradient>
              <linearGradient id="bd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd76a"/><stop offset="1" stop-color="#c98b0e"/></linearGradient>
              <linearGradient id="cl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6a7086"/><stop offset="1" stop-color="#262a38"/></linearGradient>
            </defs>
            <!-- 전구 -->
            <circle class="halo" cx="100" cy="62" r="62" fill="url(#hl)"/>
            <path d="M88 96 C68 82 70 30 100 30 C130 30 132 82 112 96 Z" fill="#fff3b0" stroke="#ffe082" stroke-width="3"/>
            <path d="M94 96 L92 62 L97 56 L100 62 L103 56 L108 62 L106 96" fill="none" stroke="#ff9800" stroke-width="3.5" stroke-linejoin="round"/>
            <rect x="88" y="96" width="24" height="18" rx="3" fill="#c3c9cf"/><!-- 꼭지쇠 -->
            <path d="M88 101 H112 M88 107 H112" stroke="#8d969e" stroke-width="2"/>
            <path d="M93 114 H107 L104 121 H96 Z" fill="#333"/>
            <rect x="96" y="120" width="8" height="7" rx="3" fill="#dfe3e7" stroke="#8d969e" stroke-width="1"/><!-- 꼭지 -->
            <!-- 전선: (+)극 → 꼭지쇠, (−)극 → 꼭지 -->
            <path d="M156 162 C190 162 190 105 146 105 L113 105" fill="none" stroke="#ff5252" stroke-width="7" stroke-linecap="round"/>
            <path d="M42 162 C10 162 12 136 46 136 L90 136 Q100 136 100 129" fill="none" stroke="#4fc3f7" stroke-width="7" stroke-linecap="round"/>
            <!-- 전지 -->
            <rect x="44" y="146" width="104" height="32" rx="7" fill="url(#cl)"/>
            <rect x="120" y="146" width="28" height="32" fill="url(#bd)"/>
            <rect x="148" y="155" width="8" height="14" rx="2" fill="#dfe3e7"/>
            <text x="82" y="168" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" font-family="system-ui">1.5V</text>
            <text x="134" y="169" text-anchor="middle" font-size="16" font-weight="900" fill="#5a3d00" font-family="system-ui">+</text>
            <!-- 반짝 -->
            <path d="M160 26 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#fff59d"/>
            <path d="M38 34 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" fill="#fff59d" opacity=".8"/>
          </svg>
        </div>
        <div class="title">6학년 전기회로</div>
        <div class="meta"><span class="tag">과학</span><span class="tag y">실험 키트</span></div>
      </a>

      <a class="card" href="wonhong-detective/" aria-label="지구촌 탐정단, 괴도 원홍을 잡아라 게임으로 가기">
        <div class="icon" style="background:linear-gradient(160deg,#1b3158,#0e1b33)">
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <defs>
              <radialGradient id="sea" cx=".4" cy=".35"><stop offset="0" stop-color="#7cc8ff"/><stop offset="1" stop-color="#2f7fd6"/></radialGradient>
            </defs>
            <!-- 지구 -->
            <circle cx="88" cy="88" r="56" fill="url(#sea)"/>
            <path d="M58 56 C70 46 86 50 90 60 C94 70 82 74 84 84 C86 94 72 98 66 90 C60 82 50 78 52 68 Z" fill="#4fd18b"/>
            <path d="M104 46 C118 48 132 58 134 72 C126 74 118 68 110 70 C104 62 98 54 104 46 Z" fill="#4fd18b"/>
            <path d="M100 96 C112 92 126 98 128 110 C124 124 110 132 102 124 C96 116 92 104 100 96 Z" fill="#4fd18b"/>
            <path d="M32 88 H144 M88 32 C66 52 66 124 88 144 M88 32 C110 52 110 124 88 144" fill="none" stroke="#ffffff" stroke-opacity=".25" stroke-width="2"/>
            <circle cx="88" cy="88" r="56" fill="none" stroke="#ffc83d" stroke-width="4"/>
            <!-- 원홍의 발자국 -->
            <g fill="#ff5d6c">
              <ellipse cx="34" cy="170" rx="6" ry="9" transform="rotate(-20 34 170)"/>
              <ellipse cx="56" cy="160" rx="6" ry="9" transform="rotate(-20 56 160)"/>
              <ellipse cx="74" cy="176" rx="6" ry="9" transform="rotate(-20 74 176)"/>
            </g>
            <!-- 돋보기 -->
            <line x1="150" y1="148" x2="182" y2="182" stroke="#8a5a2b" stroke-width="13" stroke-linecap="round"/>
            <circle cx="132" cy="128" r="30" fill="#ffffff" fill-opacity=".22" stroke="#ffc83d" stroke-width="9"/>
            <path d="M118 116 A18 18 0 0 1 134 108" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-opacity=".8"/>
            <!-- 물음표 -->
            <text x="132" y="140" text-anchor="middle" font-size="32" font-weight="900" fill="#fff" font-family="system-ui">?</text>
            <path d="M168 30 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#ffc83d"/>
          </svg>
        </div>
        <div class="title">지구촌 탐정단</div>
        <div class="sub">괴도 원홍을 잡아라!</div>
        <div class="meta"><span class="tag" style="background:#e6f0ff;color:#1f4fbf">사회</span><span class="tag y">추리 게임</span></div>
      </a>

      <a class="card" href="block/" aria-label="쌓기나무 위·앞·옆에서 본 모양 학습으로 가기">
        <div class="icon" style="background:linear-gradient(160deg,#fff4dc,#ffe2a8)">
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <defs>
              <linearGradient id="wt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffdca3"/><stop offset="1" stop-color="#f6c47a"/></linearGradient>
              <g id="cb">
                <path d="M0 0 L22 -12 L44 0 L22 12 Z" fill="url(#wt)"/>
                <path d="M0 0 L22 12 L22 38 L0 26 Z" fill="#f0ae57"/>
                <path d="M22 12 L44 0 L44 26 L22 38 Z" fill="#e39a3f"/>
              </g>
            </defs>
            <!-- 쌓기나무 (교과서 L자 모양) -->
            <g stroke="#9a6a2e" stroke-width="2.5" stroke-linejoin="round">
              <use href="#cb" x="45" y="108"/>
              <use href="#cb" x="45" y="82"/>
              <use href="#cb" x="67" y="120"/>
              <use href="#cb" x="111" y="120"/>
              <use href="#cb" x="111" y="94"/>
              <use href="#cb" x="111" y="68"/>
              <use href="#cb" x="89" y="132"/>
            </g>
            <!-- 위·앞·옆 표시 -->
            <circle cx="133" cy="26" r="15" fill="#2e8b3e"/><text x="133" y="32" text-anchor="middle" font-size="17" font-weight="900" fill="#fff" font-family="system-ui">위</text>
            <circle cx="36" cy="176" r="15" fill="#e89a00"/><text x="36" y="182" text-anchor="middle" font-size="17" font-weight="900" fill="#fff" font-family="system-ui">앞</text>
            <circle cx="170" cy="176" r="15" fill="#d0443a"/><text x="170" y="182" text-anchor="middle" font-size="17" font-weight="900" fill="#fff" font-family="system-ui">옆</text>
            <path d="M133 44 V54 M50 166 L62 156 M156 166 L144 156" stroke="#555" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="title">쌓기나무 위·앞·옆</div>
        <div class="sub">본 모양 그리기 · 보고 쌓기</div>
        <div class="meta"><span class="tag" style="background:#e9f7ee;color:#1e7b3c">수학</span><span class="tag y">3D 학습</span></div>
      </a>

      <a class="card" href="sun_altitude/" aria-label="태양 고도 측정 실습으로 가기">
        <div class="icon" style="background:linear-gradient(160deg,#7cc4ff,#3f86d9)">
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <!-- 태양 -->
            <circle class="halo" cx="150" cy="46" r="34" fill="#ffe27a" opacity=".55"/>
            <circle cx="150" cy="46" r="20" fill="#ffd23f" stroke="#fff3b0" stroke-width="3"/>
            <!-- 땅과 판 -->
            <rect x="0" y="150" width="200" height="50" fill="#79ab5e"/>
            <path d="M18 160 L172 160 L188 176 L6 176 Z" fill="#f3f1ea"/>
            <!-- 그림자 -->
            <path d="M66 162 L26 162" stroke="#2a2540" stroke-opacity=".6" stroke-width="4" stroke-linecap="round"/>
            <!-- 막대 -->
            <line x1="66" y1="162" x2="66" y2="70" stroke="#7a4e2c" stroke-width="6" stroke-linecap="round"/>
            <circle cx="66" cy="68" r="5" fill="#ffc83d"/>
            <!-- 각도기 -->
            <path d="M2 162 A24 24 0 0 1 50 162 Z" fill="#fff7c8" stroke="#2a2540" stroke-width="2.5"/>
            <!-- 실 -->
            <line x1="66" y1="68" x2="26" y2="162" stroke="#e03131" stroke-width="3"/>
            <!-- 햇빛 -->
            <path d="M132 58 L76 96" stroke="#fff3b0" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round"/>
            <path d="M40 152 A14 14 0 0 1 32 147" fill="none" stroke="#e03131" stroke-width="3"/>
          </svg>
        </div>
        <div class="title">태양 고도 측정</div>
        <div class="sub">막대 그림자로 재는 태양 고도</div>
        <div class="meta"><span class="tag">과학</span><span class="tag y">3D 실험</span></div>
      </a>

      <div class="card soon" aria-hidden="true">
        <div class="icon">✨</div>
        <div class="title">새 작품 준비 중</div>
        <div class="meta"><span class="tag y">Coming soon</span></div>
      </div>
    </div>
  </main>

  <footer><a href="https://games.brendy.net/">Brendy Games</a> · 배우는 즐거움, 노는 즐거움<br>© <a href="https://brendy.net/">Brendy.Net</a> all rights reserved.(Since 2000)</footer>
</div>
</body>
</html>
