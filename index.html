<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brendy Games</title>
<meta name="description" content="놀면서 배우는 교실 게임과 실험실">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
<style>
  :root{
    --bg:#fff8ec; --bg2:#ffeccc; --ink:#2a2540; --muted:#6c6582; --card:#ffffff; --line:#f0e2c8;
    --c1:#ff6b6b; --c2:#ffb703; --c3:#2ec4b6; --c4:#4f7cff; --c5:#9b5de5; --shadow:0 10px 30px rgba(80,50,10,.12);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17142a; --bg2:#221d3d; --ink:#f4f1ff; --muted:#a9a3c4; --card:#25204a; --line:#3a3466; --shadow:0 10px 30px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{min-height:100vh;color:var(--ink);background:radial-gradient(1200px 600px at 10% -10%,var(--bg2),transparent 60%),
    radial-gradient(900px 500px at 110% 10%,var(--bg2),transparent 60%),var(--bg);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;overflow-x:hidden}
  .bgshapes{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .bgshapes span{position:absolute;font-size:42px;opacity:.16;animation:float 9s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-18px) rotate(8deg)}}
  .wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:48px 16px 32px}

  header{text-align:center;margin-bottom:44px}
  .logo{display:inline-flex;align-items:center;gap:14px}
  .logo .pad{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:36px;
    background:linear-gradient(135deg,var(--c4),var(--c5));box-shadow:var(--shadow);transform:rotate(-6deg)}
  h1{font-size:clamp(36px,7vw,60px);margin:0;letter-spacing:-1px;font-weight:900}
  h1 .g{background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c4));-webkit-background-clip:text;background-clip:text;color:transparent}
  .tagline{margin:14px 0 0;font-size:clamp(17px,2.6vw,21px);color:var(--muted);font-weight:600}
  .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
  .chip{padding:6px 14px;border-radius:999px;font-size:14px;font-weight:700;background:var(--card);border:2px solid var(--line)}

  h2{font-size:20px;margin:0 0 16px;display:flex;align-items:center;gap:8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
  .card{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:inherit;background:var(--card);
    border:3px solid var(--line);border-radius:28px;padding:22px 18px 20px;box-shadow:var(--shadow);
    transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
  a.card:hover,a.card:focus-visible{transform:translateY(-6px) rotate(-1deg);border-color:var(--c2);outline:none;
    box-shadow:0 18px 40px rgba(255,170,0,.25)}
  .icon{width:100%;max-width:200px;aspect-ratio:1;border-radius:22px;display:grid;place-items:center;
    background:linear-gradient(160deg,#2b2f5a,#171a36)}
  .icon svg{width:88%;height:88%}
  .halo{transition:opacity .3s, r .3s;opacity:.75}
  a.card:hover .halo{opacity:1}
  .title{margin-top:16px;font-size:23px;font-weight:900}
  .meta{margin-top:6px;display:flex;gap:6px}
  .tag{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:#e7fbf8;color:#11796f}
  .tag.y{background:#fff2cc;color:#8a5a00}
  .card.soon{opacity:.7;border-style:dashed;box-shadow:none;background:transparent}
  .card.soon .icon{background:transparent;border:3px dashed var(--line);font-size:64px}

  footer{margin-top:56px;text-align:center;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="bgshapes" aria-hidden="true">
  <span style="left:6%;top:14%">⚡</span><span style="left:86%;top:20%;animation-delay:-2s">🔬</span>
  <span style="left:12%;top:72%;animation-delay:-4s">🧩</span><span style="left:80%;top:76%;animation-delay:-6s">🎲</span>
  <span style="left:48%;top:88%;animation-delay:-3s">✏️</span>
</div>
<div class="wrap">
  <header>
    <div class="logo"><div class="pad">🎮</div><h1><span class="g">Brendy</span> Games</h1></div>
    <p class="tagline">놀면서 배우는 우리 반 게임 &amp; 실험실</p>
    <div class="chips"><span class="chip">🎮 게임</span><span class="chip">🔬 과학 실험</span><span class="chip">📚 교과 학습</span></div>
  </header>

  <main>
    <h2>🧪 작품 모음</h2>
    <div class="grid">
      <a class="card" href="elect1/" aria-label="6학년 전기회로 실험실로 가기">
        <div class="icon">
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <defs>
              <radialGradient id="hl"><stop offset="0" stop-color="#fff59d"/><stop offset=".4" stop-color="#ffd54f" stop-opacity=".7"/><stop offset="1" stop-color="#ffb300" stop-opacity="0"/></radialGradient>
              <linearGradient id="bd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd76a"/><stop offset="1" stop-color="#c98b0e"/></linearGradient>
              <linearGradient id="cl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6a7086"/><stop offset="1" stop-color="#262a38"/></linearGradient>
            </defs>
            <!-- 전선 -->
            <path d="M152 150 C182 150 186 112 176 90 C168 72 140 74 112 92" fill="none" stroke="#ff5252" stroke-width="7" stroke-linecap="round"/>
            <path d="M40 150 C14 150 12 110 26 92 C40 74 70 78 90 96" fill="none" stroke="#4fc3f7" stroke-width="7" stroke-linecap="round"/>
            <!-- 전구 -->
            <circle class="halo" cx="100" cy="62" r="62" fill="url(#hl)"/>
            <path d="M88 96 C68 82 70 30 100 30 C130 30 132 82 112 96 Z" fill="#fff3b0" stroke="#ffe082" stroke-width="3"/>
            <path d="M94 96 L92 62 L97 56 L100 62 L103 56 L108 62 L106 96" fill="none" stroke="#ff9800" stroke-width="3.5" stroke-linejoin="round"/>
            <rect x="88" y="96" width="24" height="18" rx="3" fill="#c3c9cf"/>
            <path d="M88 101 H112 M88 107 H112" stroke="#8d969e" stroke-width="2"/>
            <path d="M93 114 H107 L103 121 H97 Z" fill="#333"/>
            <!-- 전지 -->
            <rect x="44" y="134" width="104" height="32" rx="7" fill="url(#cl)"/>
            <rect x="120" y="134" width="28" height="32" fill="url(#bd)"/>
            <rect x="148" y="143" width="8" height="14" rx="2" fill="#dfe3e7"/>
            <text x="82" y="156" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" font-family="system-ui">1.5V</text>
            <text x="134" y="157" text-anchor="middle" font-size="16" font-weight="900" fill="#5a3d00" font-family="system-ui">+</text>
            <!-- 반짝 -->
            <path d="M160 26 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#fff59d"/>
            <path d="M38 34 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" fill="#fff59d" opacity=".8"/>
          </svg>
        </div>
        <div class="title">6학년 전기회로</div>
        <div class="meta"><span class="tag">과학</span><span class="tag y">실험 키트</span></div>
      </a>

      <div class="card soon" aria-hidden="true">
        <div class="icon">✨</div>
        <div class="title">새 작품 준비 중</div>
        <div class="meta"><span class="tag y">Coming soon</span></div>
      </div>
    </div>
  </main>

  <footer>© Brendy Games · 배우는 즐거움, 노는 즐거움</footer>
</div>
</body>
</html>
