<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>지구촌 탐정단 - 괴도 원홍을 잡아라!</title>
<style>
:root{--bg:#0e1b33;--bg2:#15284a;--card:#1b3158;--card2:#233c6a;--ink:#f4f1e8;--mute:#a9b6d3;--gold:#ffc83d;--red:#ff5d6c;--green:#4fd18b;--blue:#59b6ff}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(1200px 700px at 50% -10%,#1e3a6b,var(--bg));color:var(--ink);font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;min-height:100%}
body{padding:12px 16px 40px}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{margin:0}
.wrap{max-width:1180px;margin:0 auto}
.btn{background:var(--gold);color:#2a1f00;border:0;border-radius:14px;padding:12px 20px;font-weight:800;font-size:16px;box-shadow:0 4px 0 #b88a00;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b88a00}
.btn.ghost{background:var(--card2);color:var(--ink);box-shadow:0 4px 0 #142544}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.4;pointer-events:none}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 6px 18px #0006}
.small{font-size:13px;color:var(--mute)}
/* title */
.title{text-align:center;padding:24px 0 10px}
.globe{font-size:84px;display:inline-block;animation:spin 6s ease-in-out infinite}
@keyframes spin{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.08)}}
.title h1{font-size:clamp(28px,6vw,52px);letter-spacing:-1px;margin-top:6px}
.title h1 span{color:var(--gold)}
.title p{color:var(--mute);font-size:17px;margin:8px 0 0}
.cases{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin:26px 0}
.case{cursor:pointer;transition:transform .15s,background .15s;position:relative;border:2px solid transparent}
.case:hover{transform:translateY(-4px);background:var(--card2);border-color:var(--gold)}
.case .ic{font-size:44px}
.case h3{font-size:21px;margin:6px 0 4px}
.case .unit{display:inline-block;background:#0e1b33;color:var(--gold);border-radius:20px;padding:2px 10px;font-size:12px;margin-bottom:8px}
.stars{font-size:20px;letter-spacing:2px;margin-top:8px;min-height:26px}
.rankbar{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:6px}
.chip{background:#0e1b33;border-radius:30px;padding:6px 14px;font-size:14px}
/* hud */
.hud{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.hud .name{font-weight:800;font-size:18px}
.timebox{flex:1;min-width:200px}
.timebar{height:16px;background:#0b1630;border-radius:10px;overflow:hidden;margin-top:4px}
.timebar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold));transition:width .5s}
.timebar.low i{background:linear-gradient(90deg,var(--red),#ff9a5c)}
.trail{display:flex;gap:6px;align-items:center;font-size:20px}
.trail b{width:26px;height:26px;border-radius:50%;background:#0b1630;display:grid;place-items:center;font-size:14px}
.trail b.done{background:var(--green);color:#052}
.trail b.now{background:var(--gold);color:#2a1f00;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.2)}}
.main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:900px){.main{grid-template-columns:1fr}}
.mapcard{padding:10px;position:sticky;top:8px}
@media(max-width:900px){.mapcard{position:static}}
svg.map{width:100%;height:auto;display:block;border-radius:12px;touch-action:manipulation}
.readout{margin-top:8px;text-align:center;font-weight:700;color:var(--gold);min-height:22px}
.loc{display:flex;gap:14px;align-items:center}
.scene{font-size:54px;background:#0e1b33;border-radius:16px;width:84px;height:84px;display:grid;place-items:center}
.panel h3{margin:16px 0 8px;font-size:17px}
.wits{display:grid;gap:8px}
.wit{background:#12244a;border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.wit .face{font-size:30px}
.wit .bubble{font-size:15px;line-height:1.55}
.wit .bubble em{color:var(--gold);font-style:normal;font-weight:700}
.wit .who{font-size:12px;color:var(--mute)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.tickets{display:grid;gap:8px}
.ticket{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(90deg,#fff7dc,#ffe9a6);color:#2a1f00;border-radius:12px;padding:10px 16px;border:0;text-align:left;font-weight:800;border-left:8px dashed #c78a00;transition:transform .12s}
.ticket:hover{transform:translateX(4px)}
.ticket small{display:block;font-weight:500;color:#6b5400}
.ticket.x{opacity:.35;text-decoration:line-through;pointer-events:none}
.lock{background:#0b1630;border:2px dashed #35508a;border-radius:12px;padding:14px;text-align:center;color:var(--mute)}
.sus{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.sc{background:#12244a;border-radius:12px;padding:8px;text-align:left;border:2px solid transparent;font-size:12px;line-height:1.5}
.sc .e{font-size:30px}
.sc b{font-size:14px;display:block}
.sc.ok{border-color:var(--green)}
.sc.out{opacity:.3}
.sc.pick{cursor:pointer}
.sc.pick:hover{border-color:var(--gold)}
.sc.wrong{opacity:.25;text-decoration:line-through;pointer-events:none}
/* modal */
.modal{position:fixed;inset:0;background:#030814cc;display:grid;place-items:center;padding:14px;z-index:20;overflow:auto}
.modal.hidden{display:none}
.mbox{background:var(--bg2);border:2px solid var(--gold);border-radius:22px;padding:22px;max-width:640px;width:100%;max-height:92vh;overflow:auto;animation:pop .25s}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.mbox h2{margin-bottom:8px}
.mbox .big{font-size:56px;text-align:center}
.opts{display:grid;gap:8px;margin:12px 0}
.opt{background:var(--card2);border:2px solid transparent;border-radius:12px;padding:12px 14px;text-align:left;font-size:16px}
.opt:hover{border-color:var(--gold)}
.opt.good{background:#1d6b47;border-color:var(--green)}
.opt.bad{background:#7a2433;border-color:var(--red)}
.opt.sel{border-color:var(--gold);background:#3a4f86}
.opts.grid{grid-template-columns:repeat(3,1fr)}
.expl{background:#0b1630;border-radius:12px;padding:12px;margin-top:8px;line-height:1.6}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.notes li{margin:6px 0;line-height:1.5}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{background:var(--card);border:0;border-radius:10px;padding:8px 14px}
.tab.on{background:var(--gold);color:#2a1f00;font-weight:800}
.traitchips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.traitchips span{background:#0b1630;border:1px solid #35508a;border-radius:20px;padding:4px 10px;font-size:13px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.confetti{position:fixed;top:-30px;font-size:26px;animation:fall linear forwards;pointer-events:none;z-index:30}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.recap{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px;margin-top:8px;text-align:left}
.recap div{background:#0b1630;border-radius:12px;padding:10px;font-size:14px;line-height:1.5}
.chartbox svg{width:100%;height:auto;background:#fff;border-radius:10px}
.glow{animation:glow 1.2s infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px #ffc83d55}}
.sync{position:fixed;right:10px;bottom:8px;background:#0b1630dd;border:1px solid #35508a;border-radius:20px;padding:4px 12px;font-size:12px;color:var(--mute);z-index:15;display:none}
.inp{background:#0b1630;border:2px solid #35508a;border-radius:12px;padding:12px 14px;font:inherit;color:var(--ink);font-size:17px;width:100%}
.inp:focus{outline:0;border-color:var(--gold)}
.bgbar{max-width:1180px;margin:0 auto 6px;display:flex;justify-content:flex-end}
.brand{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);padding:5px 12px 5px 5px;border:1px solid #35508a;border-radius:999px;background:#0b1630cc;white-space:nowrap;font-size:13px;line-height:1.25}
.brand:hover{border-color:var(--gold)}
.brand .pad{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:16px;background:linear-gradient(135deg,#4f7cff,#9b5de5)}
.brand b{background:linear-gradient(90deg,#ff6b6b,#ffb703,#2ec4b6,#59b6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{color:var(--mute);font-size:11px}
.sitefoot{text-align:center;margin-top:28px;font-size:12px;color:var(--mute)}
.sitefoot a{color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:2px}
.sitefoot a:hover{color:var(--gold)}
</style>
</head>

function svgPoint(svg,ev){

  const g=INV(x,y);return {lon:g.lon,lat:g.lat,x,y};
}

function flyPlane(a,b,ms=1100){
  return new Promise(res=>{
    const svg=$("#gmap"),pl=svg&&svg.querySelector("#plane");if(!pl){res();return}
    setTimeout(()=>{pl.style.display="none";res()},ms+400);
    sfx.fly();const x1=X(a.lon),y1=Y(a.lat),x2=X(b.lon),y2=Y(b.lat);
    const ang=Math.atan2(y2-y1,x2-x1)*180/Math.PI+45;pl.style.display="block";const t0=performance.now();
    const step=t=>{let k=Math.min(1,(t-t0)/ms);const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;const x=x1+(x2-x1)*e,y=y1+(y2-y1)*e-Math.sin(Math.PI*e)*14;
      pl.setAttribute("transform",`translate(${x},${y}) rotate(${ang})`);if(k<1)requestAnimationFrame(step);else{pl.style.display="none";res()}};
    requestAnimationFrame(step);
  });
}

let S=null;

function pickRoute(n,mode){
  const kr=mode==="korea";
  for(let tries=0;tries<200;tries++){
    const pool=shuffle(poolCities(mode));const r=[];let prev=HQ;
    for(const c of pool){
      if(r.length===n)break;
      if(kr||(dist(prev,c)>2500&&(!r.length||r[r.length-1].country!==c.country))){r.push(c);prev=c}
    }
    if(r.length===n)return r;
  }
  return shuffle(poolCities(mode)).slice(0,n);
}

  const budget=Math.ceil(h*1.6+30);
  S={screen:"brief",case:C,route,stop:0,budget,hours:budget,coins:Math.max(1,U.coins||1),culprit:Math.floor(Math.random()*8),

function geoClues(c){
  const la=r5(Math.abs(c.lat)),lo=r5(Math.abs(c.lon));
  const lat=la===0?"적도(위도 0°) 바로 근처":`${NS(c.lat)} ${la}° 쯤`;
  const lon=lo===0?"본초 자오선(경도 0°) 바로 근처":`${EW(c.lon)} ${lo}° 쯤`;
  const h=Math.round(c.lon/15);
  const g3=h===0?"런던과 시각이 거의 같아요. (경도 15°마다 1시간 차이!)":`영국 런던보다 시각이 약 ${Math.abs(h)}시간 ${h>0?"빨라요":"늦어요"}. (경도 15°마다 1시간 차이!)`;
  return [
   `위치는 ${lat}, ${lon}이에요`,
   `${c.cont} 대륙에 있고, ${c.ocean}`,
   g3,
   `${c.lat>=0?"적도의 북쪽(북반구)":"적도의 남쪽(남반구)"}이고, 본초 자오선의 ${c.lon>=0?"동쪽":"서쪽"}에 있어요`

}
const climClue=c=>`기후는 ‘${c.climate} 기후’래요. ${CLIM_DESC[c.climate]} 곳이에요`;
function makeClues(c,mode){
  const g=shuffle(geoClues(c)),life=rand([...c.life,...c.land]);
  const mk=(kind,text)=>({kind,text});
  if(mode==="korea")return [mk("geo",`서울에서 보면 ${dirKo(c)}쪽에 있어요. (방위를 지도에서 확인해요!)`),mk("geo",rand([`위치는 대략 북위 ${Math.round(c.lat)}°, 동경 ${Math.round(c.lon)}° 쯤이에요`,c.ocean])),mk("life",rand([...c.nat,...c.life,...c.land]))];
  if(mode==="map")return [mk("geo",g[0]),mk("geo",g[1]),mk("life",life)];
  if(mode==="nature")return [mk("nat",c.nat[0]),mk("nat",climClue(c)),mk("life",rand(c.life))];
  return [mk("geo",g[0]),mk("nat",rand(c.nat)),mk("life",life)];
}
function buildRound(){
  const next=S.route[S.stop],cur=curCity();
  const used=new Set([next.id,cur.id,...S.route.slice(0,S.stop).map(c=>c.id)]);
  const base=poolCities(S.case.mode),kr=S.case.mode==="korea";
  let pool=base.filter(c=>!used.has(c.id)&&(kr?(dirKo(c)!==dirKo(next)||c.sea!==next.sea):dist(next,c)>3000));
  if(S.case.mode==="nature")pool=pool.filter(c=>c.climate!==next.climate||c.terrain!==next.terrain);
  if(pool.length<2)pool=base.filter(c=>!used.has(c.id));
  const ds=shuffle(pool).slice(0,2);
  const attr=S.stop<4?S.attrOrder[S.stop]:Math.floor(Math.random()*4);
  S.round={clues:makeClues(next,S.case.mode),spoken:[false,false,false],wit:shuffle(WIT).slice(0,3),tickets:shuffle([next,...ds]),wrong:[],mini:false,extra:null,attr,gone:null};
}

async function pickTicket(i){

function mapMarks(ms){return ms.map(m=>{const x=X(m.lon),y=Y(m.lat);return m.type==="target"?`<g transform="translate(${x},${y})"><circle r="9" fill="none" stroke="#4fd18b" stroke-width="2.6"/><path d="M-13 0H13M0 -13V13" stroke="#4fd18b" stroke-width="1.8"/></g>`:`<circle cx="${x}" cy="${y}" r="5" fill="#ff5d6c" stroke="#fff" stroke-width="1.5"/>`}).join("")}
function chartSVG(k){
  const d=CHART[k],W=360,H=210,L=34,Rr=34,T=14,B=26,pw=(W-L-Rr)/12;
  const ty=v=>T+(H-T-B)*(1-(v+40)/80),ry=v=>T+(H-T-B)*(1-Math.min(v,400)/400);
  let s=`<svg viewBox="0 0 ${W} ${H}" font-size="9">`;
  for(let v=0;v<=400;v+=100)s+=`<line x1="${L}" x2="${W-Rr}" y1="${ry(v)}" y2="${ry(v)}" stroke="#ddd"/><text x="${L-4}" y="${ry(v)+3}" text-anchor="end" fill="#2f6fbd">${v}</text>`;
  for(let v=-40;v<=40;v+=20)s+=`<text x="${W-Rr+4}" y="${ty(v)+3}" fill="#d9531e">${v}</text>`;
  d.r.forEach((v,i)=>{s+=`<rect x="${L+i*pw+4}" y="${ry(v)}" width="${pw-8}" height="${H-B-ry(v)}" fill="#6db3f2"/>`;s+=`<text x="${L+i*pw+pw/2}" y="${H-B+12}" text-anchor="middle" fill="#333">${i+1}</text>`});
  s+=`<polyline fill="none" stroke="#e8602c" stroke-width="2.4" points="${d.t.map((v,i)=>`${L+i*pw+pw/2},${ty(v)}`).join(" ")}"/>`;
  d.t.forEach((v,i)=>{s+=`<circle cx="${L+i*pw+pw/2}" cy="${ty(v)}" r="2.6" fill="#e8602c"/>`});
  s+=`<text x="${L-4}" y="9" text-anchor="end" fill="#2f6fbd">mm</text><text x="${W-Rr+4}" y="9" fill="#d9531e">℃</text><text x="${W/2}" y="${H-1}" text-anchor="middle" fill="#333">월</text></svg>`;
  return s;
}

function miniPack(){
  const cities=poolCities("world").filter(c=>ITEMS.some(i=>i.c.includes(c.climate)));
  const c=rand(cities),good=ITEMS.filter(i=>i.c.includes(c.climate)),bad=ITEMS.filter(i=>!i.c.includes(c.climate));
  const items=shuffle([...shuffle(good).slice(0,3),...shuffle(bad).slice(0,6-Math.min(3,good.length))]);
  MG.t={c,items,sel:new Set(),need:items.filter(i=>i.c.includes(c.climate)).length};
  showModal(`<h2>🔍 현장 조사: 짐 싸기</h2><p style="font-size:17px;line-height:1.6">다음 단서를 따라 <b>${c.name}(${c.country})</b>로 갈 때를 상상해요. 이곳은 <b>${c.climate} 기후</b>예요.<br>어울리는 짐을 <b>${MG.t.need}개</b> 골라 보세요!</p>
   <div class="opts grid">${items.map((it,i)=>`<button class="opt pk" id="pk${i}" onclick="packToggle(${i})" style="text-align:center"><div style="font-size:32px">${it.e}</div>${it.n}</button>`).join("")}</div>
   <div class="row"><button class="btn" id="packgo" disabled onclick="packCheck()">짐 확인!</button></div>`);
}
function packToggle(i){
  const t=MG.t;if(t.sel.has(i))t.sel.delete(i);else if(t.sel.size<t.need)t.sel.add(i);
  document.querySelectorAll(".pk").forEach((b,k)=>b.classList.toggle("sel",t.sel.has(k)));
  $("#packgo").disabled=t.sel.size!==t.need;
}
function packCheck(){
  const t=MG.t,ok=[...t.sel].every(i=>t.items[i].c.includes(t.c.climate));recordTopic("기후",ok);
  document.querySelectorAll(".pk").forEach((b,k)=>{if(t.items[k].c.includes(t.c.climate))b.classList.add("good");else if(t.sel.has(k))b.classList.add("bad")});
  $("#packgo").style.display="none";
  S.learned.push({quiz:true,text:`${t.c.climate} 기후(${CLIM_DESC[t.c.climate]})에는 ${t.items.filter(i=>i.c.includes(t.c.climate)).map(i=>i.n).join(", ")}이(가) 어울려요.`});
  miniEnd(ok,`<br>${t.c.climate} 기후에는 ${t.items.filter(i=>i.c.includes(t.c.climate)).map(i=>i.e+i.n).join(", ")}이(가) 어울려요.`);
}

function endHTML(){
  if(S.result==="win"){

    const qs=[...new Set(S.learned.filter(x=>x.quiz).map(x=>x.text))];
    return `<div class="card" style="max-width:820px;margin:20px auto;text-align:center"><div style="font-size:70px">🎉</div><h1>체포 성공!</h1>
    <div style="font-size:48px;margin:6px">${sp.e}</div><p style="font-size:18px;line-height:1.7"><b>${sp.n}</b>${boss?"의 가면을 벗기자… 정체는 바로 두목 <b>괴도 원홍</b>이었어요! 😲":"을(를) 체포했어요!"}<br>${S.case.item}을(를) 무사히 되찾았어요.</p>
    <div style="font-size:36px;letter-spacing:6px">${"⭐".repeat(S.stars)}${"☆".repeat(3-S.stars)}</div>
    <div class="rankbar"><span class="chip">⏱️ 남은 시간 ${S.hours}시간</span><span class="chip">❌ 실수 ${S.mistakes}번</span><span class="chip">🧠 퀴즈 ${S.quizRight}/${S.quizTotal}</span></div>
    <h3 style="margin-top:18px">📚 오늘 배운 곳</h3><div class="recap">${facts.map(c=>`<div>${c.e} <b>${c.name} (${c.country})</b><br>${c.fact}</div>`).join("")}</div>
    ${qs.length?`<h3 style="margin-top:18px">🧠 현장 조사 복습</h3><div class="recap">${qs.map(t=>`<div>${t}</div>`).join("")}</div>`:""}
    <div class="row" style="justify-content:center;margin-top:20px"><button class="btn ghost" onclick="S=null;render()">사건 목록</button><button class="btn" onclick="startCase('${S.case.id}')">같은 사건 다시 도전 🔁</button></div></div>`;
  }
  return `<div class="card" style="max-width:640px;margin:40px auto;text-align:center"><div style="font-size:70px">⏰</div><h1>시간이 다 됐어요…</h1>
  <p style="font-size:18px;line-height:1.7">괴도의 비행기가 먼저 떠나 버렸어요. 하지만 탐정은 실패에서 배우는 법!<br>이번엔 <b>위도·경도 눈금</b>과 <b>기후·지형 단서</b>를 더 꼼꼼히 비교해 보세요.</p>
  <div class="row" style="justify-content:center"><button class="btn ghost" onclick="S=null;render()">사건 목록</button><button class="btn" onclick="startCase('${S.case.id}')">다시 도전 🔁</button></div></div>`;
}
function confetti(){
  const em=["🎉","⭐","🌍","🏆","✨","🎊","🗺️"];
  for(let i=0;i<36;i++){const d=document.createElement("div");d.className="confetti";d.textContent=rand(em);d.style.left=Math.random()*100+"vw";d.style.animationDuration=(2+Math.random()*2.5)+"s";d.style.animationDelay=Math.random()*.8+"s";document.body.appendChild(d);setTimeout(()=>d.remove(),5500)}
}
dbLoad();DB.users.guest=DB.users.guest||newUser("");U=DB.users.guest;UID="guest";UNAME="탐정";render();
</script>
